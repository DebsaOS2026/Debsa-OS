[dir=rtl] .side .logo{background-position:right center}
.side .portal{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-weight:700;margin:16px 10px 16px;display:flex;align-items:center;gap:8px}
.side .portal::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px var(--orange)}
[dir=rtl] .side .portal{letter-spacing:0;font-size:13px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--fg-3);text-decoration:none;font-weight:600;font-size:14px;transition:background .2s,color .2s}
.nav a:hover{background:var(--glass-2);color:var(--fg)}
.nav a.on{background:linear-gradient(90deg,rgba(233,146,70,.2),rgba(233,146,70,.04));color:#fff;box-shadow:inset 2px 0 0 var(--orange)}
[dir=rtl] .nav a.on{background:linear-gradient(270deg,rgba(233,146,70,.2),rgba(233,146,70,.04));box-shadow:inset -2px 0 0 var(--orange)}
.nav a.on svg{stroke:var(--orange)}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .count{margin-inline-start:auto;background:var(--orange);color:#1a1a1a;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px;box-shadow:0 0 12px var(--orange-glow)}
.side .sep{height:1px;background:var(--edge);margin:16px 6px}
.side .portals .portal{margin-top:0}
.side .portals a{font-size:13px;padding:8px 12px}
.side .me{margin-top:auto;padding:12px;border-radius:12px;background:var(--glass-2);border:1px solid var(--edge);display:flex;align-items:center;gap:10px}
.side .me .av{width:34px;height:34px;border-radius:50%;background:var(--orange);color:#1a1a1a;display:grid;place-items:center;font-weight:800;box-shadow:0 0 14px var(--orange-glow)}
.side .me b{display:block;font-size:13px}
.side .me small{color:var(--fg-3);font-size:12px}
.side .me button{margin-inline-start:auto;background:none;border:0;color:var(--fg-3);padding:6px}
.side .me button:hover{color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:18px 32px;background:rgba(12,12,14,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:5}
.top h1{margin:0;font-family:var(--f-en);font-size:22px;font-weight:600;letter-spacing:-.01em}
[dir=rtl] .top h1{font-family:var(--f-ar);font-weight:700}
.top .date{color:var(--fg-3);font-size:13px}
.top .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-3);font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft),0 0 10px var(--good);animation:livep 2.4s infinite}
.live.off i{background:var(--fg-4);box-shadow:0 0 0 3px var(--glass-2);animation:none}
@keyframes livep{50%{opacity:.45}}
.iconbtn{border:1px solid var(--edge);background:var(--glass-2);border-radius:10px;height:36px;min-width:36px;display:inline-grid;place-items:center;color:var(--fg-2);padding:0 10px;font-weight:800;font-size:13px}
.iconbtn:hover{border-color:var(--edge-2);color:#fff}
.iconbtn[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#1a1a1a}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--edge-2);background:var(--glass-2);border-radius:11px;padding:9px 14px;font-weight:700;font-size:13.5px;color:var(--fg);text-decoration:none;transition:all .2s}
.btn:hover{border-color:rgba(255,255,255,.3);background:var(--glass-3)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#1a1a1a;box-shadow:0 6px 20px -6px var(--orange-glow)}
.btn.pri:hover{background:var(--orange-2);border-color:var(--orange-2)}
.btn.dark{background:#000;border-color:#000;color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.content{padding:26px 32px 40px;display:flex;flex-direction:column;gap:22px}
.view{display:none;flex-direction:column;gap:22px}
.view.on{display:flex;animation:viewin .5s cubic-bezier(.2,.7,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.foot{margin-top:auto;padding:16px 32px;color:var(--fg-4);font-size:12.5px;border-top:1px solid var(--edge);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- cards & KPIs ---------- */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);padding:20px 22px;min-width:0;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.card h3{margin:0 0 4px;font-family:var(--f-en);font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:10px}
[dir=rtl] .card h3{font-family:var(--f-ar);font-weight:700}
.card .sub{color:var(--fg-3);font-size:12.5px;margin:0 0 14px}
.card .hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.card .hd .sp{flex:1}
.kpi{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .25s,border-color .25s}
.kpi:hover{transform:translateY(-2px);border-color:var(--edge-2)}
.kpi .l{font-size:11.5px;font-weight:700;color:var(--fg-3);letter-spacing:.1em;text-transform:uppercase}
[dir=rtl] .kpi .l{letter-spacing:0;font-size:13px}
.kpi .v{font-family:var(--f-en);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.kpi .s{font-size:12.5px;color:var(--fg-3)}
.kpi.hot{background:linear-gradient(160deg,rgba(233,146,70,.24),rgba(233,146,70,.06));border-color:rgba(233,146,70,.45)}
.kpi.hot .v{color:var(--orange-2);text-shadow:0 0 24px var(--orange-glow)}
.kpi.alert{border-color:rgba(239,138,116,.4);background:linear-gradient(160deg,rgba(239,138,116,.16),rgba(20,20,23,.78))}
.kpi.alert .v{color:var(--bad)}
.kpi::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:transparent}
.kpi.acc::after{background:var(--orange);box-shadow:0 0 14px var(--orange)}

/* ---------- tables ---------- */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .sp{flex:1}
.search{border:1px solid var(--edge);border-radius:11px;padding:9px 12px;min-width:220px;background:rgba(0,0,0,.25)}
.search::placeholder{color:var(--fg-4)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--edge);background:var(--glass-2);border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--fg-2)}
.chip:hover{border-color:var(--edge-2)}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#1a1a1a}
.chip .c{opacity:.6;margin-inline-start:4px}
.tbl{overflow:auto;border:1px solid var(--edge);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:rgba(255,255,255,.04);text-align:start;font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:11px 12px;white-space:nowrap;border-bottom:1px solid var(--edge)}
[dir=rtl] th{letter-spacing:0;font-size:12.5px}
td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;color:var(--fg-2)}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover td{background:rgba(255,255,255,.035)}
tbody tr.click{cursor:pointer}
td.r,th.r{text-align:end;font-variant-numeric:tabular-nums}
td .t{font-weight:700;color:var(--fg)}
td .m{color:var(--fg-3);font-size:12.5px}
.empty{padding:34px;text-align:center;color:var(--fg-3)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--glass-3);color:var(--fg-2)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}.pill.acc{background:var(--orange-soft);color:var(--orange-2)}.pill.dark{background:#000;color:#fff;border:1px solid var(--edge-2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;box-shadow:0 0 6px currentColor}

/* ---------- the ascent (3D) ---------- */
.ascent{position:relative;height:440px;border-radius:var(--r);overflow:hidden;border:1px solid var(--edge);background:#0a0a0c}
.ascent canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ascent .ov-l{position:absolute;inset:0;pointer-events:none}
.ascent .head{position:absolute;top:18px;inset-inline-start:20px;pointer-events:none;max-width:52%}
.ascent .head .k{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--orange);font-weight:700}
[dir=rtl] .ascent .head .k{letter-spacing:0;font-size:13px}
.ascent .head h2{margin:6px 0 4px;font-family:var(--f-en);font-weight:300;font-size:30px;line-height:1.1;text-shadow:0 4px 20px rgba(0,0,0,.8)}
[dir=rtl] .ascent .head h2{font-family:var(--f-ar);font-weight:400;line-height:1.5}
.ascent .head h2 b{font-weight:600;color:var(--orange-2)}
.ascent .head p{margin:0;color:var(--fg-2);font-size:13px;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.ascent .tip{position:absolute;pointer-events:none;background:rgba(14,14,16,.92);border:1px solid var(--edge-2);border-radius:10px;padding:8px 12px;font-size:12.5px;transform:translate(-50%,-125%);white-space:nowrap;opacity:0;transition:opacity .15s;z-index:3}
.ascent .tip.on{opacity:1}
.ascent .tip b{display:block;font-size:13px}
.ascent .camp{position:absolute;transform:translate(8px,-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center;padding:5px 10px;border-radius:9px;background:rgba(14,14,16,.7);border:1px solid var(--edge);white-space:nowrap;font-size:11.5px}
.ascent .camp.l{transform:translate(calc(-100% - 8px),-50%)}
.ascent .camp small{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);font-weight:700}
[dir=rtl] .ascent .camp.l{transform:translate(calc(-100% - 8px),-50%)}
.ascent .camp small{letter-spacing:0;font-size:11px}
.ascent .camp b{font-weight:600}
.ascent .camp i{font-style:normal;color:var(--orange-2);font-weight:800}
.ascent .legend{position:absolute;bottom:14px;inset-inline-start:20px;display:flex;gap:14px;font-size:12px;color:var(--fg-2);flex-wrap:wrap}
.ascent .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-inline-end:6px;vertical-align:middle;box-shadow:0 0 8px currentColor}

/* ---------- pipeline flow ---------- */
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;position:relative}
.fstep{background:var(--glass-2);border-radius:12px;padding:14px 12px;position:relative;border:1px solid var(--edge);transition:transform .2s}
.fstep:hover{transform:translateY(-2px)}
.fstep .n{font-family:var(--f-en);font-size:26px;font-weight:600}
.fstep .l{font-size:12px;font-weight:700;color:var(--fg-3);margin-top:2px}
.fstep .v{font-size:12px;color:var(--fg-2);margin-top:6px}
.fstep.bd{border-top:2px solid var(--info)}.fstep.tech{border-top:2px solid var(--orange)}.fstep.won{border-top:2px solid var(--good);background:var(--good-soft)}
.flow-legend{display:flex;gap:16px;font-size:12px;color:var(--fg-3);margin-top:12px;flex-wrap:wrap}
.flow-legend i{width:10px;height:3px;display:inline-block;margin-inline-end:6px;vertical-align:middle}

/* ---------- kanban ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(252px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:rgba(0,0,0,.22);border:1px solid var(--edge);border-radius:13px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col .ch{display:flex;justify-content:space-between;font-weight:800;font-size:12px;color:var(--fg-2);padding:4px 4px 6px;letter-spacing:.02em}
.kc{background:var(--glass-2);border:1px solid var(--edge);border-radius:11px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .2s,box-shadow .2s}
.kc:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 10px 24px -12px var(--orange-glow)}
.kc b{font-size:13.5px;color:var(--fg)}
.kc .m{font-size:12px;color:var(--fg-3)}
.kc .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- alerts & feed ---------- */
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-radius:11px;background:var(--glass-2);border-inline-start:3px solid var(--fg-4);transition:transform .2s}
.al[data-o]:hover{transform:translateX(3px)}
[dir=rtl] .al[data-o]:hover{transform:translateX(-3px)}
.al.bad{border-color:var(--bad);background:var(--bad-soft)}.al.warn{border-color:var(--warn);background:var(--warn-soft)}.al.info{border-color:var(--info);background:var(--info-soft)}
.al b{font-size:13.5px;color:var(--fg)}.al .m{font-size:12.5px;color:var(--fg-2)}
.al .tag{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
[dir=rtl] .al .tag{letter-spacing:0;font-size:12px}
.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;color:var(--fg-2)}
.fi:last-child{border-bottom:0}
.fi time{color:var(--fg-3);font-size:12px;font-variant-numeric:tabular-nums}
.fi .who{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
[dir=rtl] .fi .who{letter-spacing:0;font-size:12px}
.who.ceo{color:#fff}.who.accountant{color:var(--good)}.who.bizdev{color:var(--info)}.who.technical{color:var(--orange-2)}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:11px}
.br{display:grid;grid-template-columns:140px 1fr 110px;gap:10px;align-items:center;font-size:13px;color:var(--fg-2)}
.br .track{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.br .fill{height:100%;background:linear-gradient(90deg,var(--orange-d),var(--orange-2));border-radius:99px;transition:width 1.1s cubic-bezier(.2,.7,.2,1);box-shadow:0 0 10px var(--orange-glow)}
[dir=rtl] .br .fill{background:linear-gradient(270deg,var(--orange-d),var(--orange-2))}
.br .v{text-align:end;font-variant-numeric:tabular-nums;font-weight:700;color:var(--fg)}
.cols{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cols .pair{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.cols .b{width:42%;max-width:26px;border-radius:5px 5px 0 0;min-height:2px;transition:height 1s cubic-bezier(.2,.7,.2,1)}
.cols .b.in{background:linear-gradient(180deg,var(--good),rgba(124,197,154,.4));box-shadow:0 0 12px rgba(124,197,154,.35)}.cols .b.out{background:rgba(255,255,255,.22)}
.cols small{font-size:11.5px;color:var(--fg-3)}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(5,5,7,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.ov.on{display:flex}
.modal{background:rgba(22,22,25,.96);border:1px solid var(--edge-2);border-radius:20px;width:min(640px,100%);box-shadow:0 40px 100px rgba(0,0,0,.6);display:flex;flex-direction:column;animation:mod .35s cubic-bezier(.2,.7,.2,1)}
@keyframes mod{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.modal.wide{width:min(920px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--edge)}
.modal .mh h2{margin:0;font-family:var(--f-en);font-size:18px;font-weight:600;flex:1}
[dir=rtl] .modal .mh h2{font-family:var(--f-ar);font-weight:700}
.modal .mb{padding:20px 22px;display:flex;flex-direction:column;gap:14px;color:var(--fg-2)}
.modal .mf{padding:14px 22px;border-top:1px solid var(--edge);display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.modal .mf .err{color:var(--bad);font-size:13px;margin-inline-end:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:700;color:var(--fg-2)}
.f label .req{color:var(--orange)}
.f input,.f select,.f textarea{border:1px solid var(--edge-2);border-radius:11px;padding:10px 12px;background:rgba(0,0,0,.3);width:100%;color:var(--fg)}
.f select option{background:#1a1a1d}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px var(--orange-soft)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--edge-2);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--fg-2)}
.checks label:has(input:checked){border-color:var(--orange);background:var(--orange-soft);color:#fff}
.checks input{accent-color:var(--orange)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;font-size:13.5px}
.kv dt{color:var(--fg-3);font-weight:700;font-size:12.5px}
.kv dd{margin:0;color:var(--fg)}
.timeline{display:flex;flex-direction:column;gap:10px;border-inline-start:2px solid rgba(233,146,70,.35);padding-inline-start:14px}
.timeline .ti b{font-size:13px;color:var(--fg)}.timeline .ti .m{font-size:12px;color:var(--fg-3)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--orange);color:#1a1a1a;padding:12px 20px;border-radius:12px;font-weight:800;z-index:80;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 10px 30px -8px var(--orange-glow)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--bad)}
.celebrate{position:fixed;inset:0;z-index:90;pointer-events:none;display:grid;place-items:center;background:radial-gradient(60% 45% at 50% 50%,rgba(8,8,10,.82),transparent 75%);animation:cel 2.8s ease forwards}
.celebrate .burst{font-family:var(--f-en);font-size:44px;font-weight:300;color:#fff;text-align:center;text-shadow:0 0 40px var(--orange-glow);animation:cel 2.8s ease forwards}
.celebrate .burst b{color:var(--orange-2);font-weight:600;display:block}
[dir=rtl] .celebrate .burst{font-family:var(--f-ar)}
@keyframes cel{0%{opacity:0;transform:scale(.9)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

[dir=rtl] .login .art .logo{background-position:right center}
.login .art h2{font-family:var(--f-en);font-weight:300;font-size:50px;line-height:1.1;margin:0;text-shadow:0 6px 30px rgba(0,0,0,.8)}
.login .art h2 b{font-weight:600;color:var(--orange-2)}
[dir=rtl] .login .art h2{font-family:var(--f-ar);font-weight:400;line-height:1.5}
.login .art .k{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:12px}
[dir=rtl] .login .art .k{letter-spacing:0;font-size:14px}
.login .form-side{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:40px 28px}
.login form{width:min(400px,100%);display:flex;flex-direction:column;gap:16px;background:rgba(16,16,19,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--edge-2);border-radius:22px;padding:30px;box-shadow:0 40px 90px rgba(0,0,0,.55)}
.login h1{font-family:var(--f-en);font-size:26px;margin:0;font-weight:600}
[dir=rtl] .login h1{font-family:var(--f-ar)}
.login p{color:var(--fg-3);margin:0}
.login .roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.login .roles button{border:1px solid var(--edge);background:var(--glass-2);border-radius:12px;padding:11px;font-weight:700;font-size:13px;text-align:start;color:var(--fg);transition:all .2s}
.login .roles button:hover{border-color:var(--edge-2)}
.login .roles button[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-soft);box-shadow:0 0 0 3px rgba(233,146,70,.12)}
.login .roles small{display:block;color:var(--fg-3);font-weight:600;font-size:11.5px;margin-top:2px}
.login .err{color:var(--bad);font-size:13px;min-height:18px}
.login .cred{color:var(--fg-4);font-size:12px;text-align:center}
.login .snd{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-3);cursor:pointer;justify-content:center}
.login .snd input{accent-color:var(--orange)}

.lang{border:1px solid var(--edge);background:var(--glass-2);border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;color:var(--fg)}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.flow{grid-template-columns:repeat(4,minmax(0,1fr))}.g21{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:14px;min-width:0;border-inline-end:0;border-bottom:1px solid var(--edge)}
  .side .nav{flex-direction:row;overflow-x:auto;min-width:0}
  .side .nav a{white-space:nowrap;flex:none}
  .side .portals,.side .sep,.side .me small{display:none}

  function load(){ if (S) return S; try { S = JSON.parse(sessionStorage.getItem(KEY)); } catch(e){} if (!S) { S = seed(); persist(); } return S; }

  function log(tb, row, action, old){
    let s = row.title || row.name || row.client_name || row.description || row.note || '';
    if (old && old.stage !== row.stage && row.stage) s += ' · ' + old.stage + ' → ' + row.stage;
    else if (old && old.status !== row.status && row.status) s += ' · ' + old.status + ' → ' + row.status;
    load().dp_activity.unshift({id:nextId('dp_activity'), at:new Date().toISOString(), actor_role:SESSION_ROLE, entity:tb, entity_id:row.id, action, summary:s});
  }
  const notify = () => { persist(); listeners.forEach(f => setTimeout(f, 60)); };
  function guard(tb, old, patch){
    if (SESSION_ROLE === 'technical' && tb === 'dp_opportunities'){
      if (BD_STAGES.includes(old.stage)) throw new Error('This opportunity has not been recommended to Technical yet');
      if (patch.stage && BD_STAGES.includes(patch.stage)) throw new Error('Technical cannot move an opportunity back to BD stages');
    }
  }
  return {
    async list(tb, opt={}){ let rows = [...(load()[tb] || [])]; if (opt.order) rows.sort((a,b) => { const x = a[opt.order] ?? '', y = b[opt.order] ?? ''; return (x > y ? 1 : x < y ? -1 : 0) * (opt.asc ? 1 : -1); }); if (opt.limit) rows = rows.slice(0, opt.limit); return JSON.parse(JSON.stringify(rows)); },
    async insert(tb, row){ const r = Object.assign({id:nextId(tb), created_at:new Date().toISOString(), updated_at:new Date().toISOString()}, row);

      if (tb === 'dp_followups') r.author = SESSION_ROLE; load()[tb].push(r); if (tb !== 'dp_team') log(tb, r, 'insert'); notify(); return r; },
    async update(tb, id, patch){ const arr = load()[tb]; const i = arr.findIndex(r => r.id === id); const old = arr[i]; guard(tb, old, patch);
      const r = Object.assign({}, old, patch, {updated_at:new Date().toISOString()});
      if (tb === 'dp_opportunities' && r.stage === 'recommended' && old.stage !== 'recommended') r.recommended_at = new Date().toISOString();
      arr[i] = r; if (tb !== 'dp_team') log(tb, r, 'update', old); notify(); return r; },
    async remove(tb, id){ const arr = load()[tb]; const i = arr.findIndex(r => r.id === id); const old = arr[i]; arr.splice(i, 1); if (tb !== 'dp_team') log(tb, old, 'delete'); notify(); },
    reset(){ S = seed(); persist(); }

function roleFromEmail(email){ const [u, dom] = String(email || '').toLowerCase().split('@'); if (dom !== String(CFG.AUTH_DOMAIN).toLowerCase()) return null; return ['ceo','accountant','bizdev','technical'].includes(u) ? u : null; }
function client(){
  if (!sb && !DEMO){
    if (!window.supabase){ document.body.innerHTML = '<div style="max-width:520px;margin:12vh auto;padding:28px;font-family:sans-serif;background:#fff;border:1px solid #e1e1e4;border-radius:14px"><h2 style="margin:0 0 8px">'+esc(L('Cannot reach the server','تعذّر الاتصال بالخادم'))+'</h2><p style="color:#666">'+esc(L('Check your internet connection and reload the page.','تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.'))+'</p></div>'; throw new Error('supabase-js not loaded'); }
    sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
  }
  return sb; }
async function signIn(username, password){
  if (DEMO){ const r = ['ceo','accountant','bizdev','technical'].includes(username) ? username : 'ceo'; try { sessionStorage.setItem('dp_demo_role', r); } catch(e){} return r; }
  client(); const email = username.trim().toLowerCase() + '@' + CFG.AUTH_DOMAIN;
  const { data, error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error;
  const r = roleFromEmail(data.user.email); if (!r){ await sb.auth.signOut(); throw new Error(t('no_access')); } return r;
}
async function requireRole(allowed){
  if (DEMO){ let r = 'ceo'; try { r = sessionStorage.getItem('dp_demo_role') || 'ceo'; } catch(e){} SESSION_ROLE = r; SESSION_USER = r;
    if (!allowed.includes(r) && r !== 'ceo'){ location.href = ROLE_HOME[r]; return null; } return r; }
  client(); const { data:{ session } } = await sb.auth.getSession();
  if (!session){ location.href = 'index.html'; return null; }
  const r = roleFromEmail(session.user.email); if (!r){ await sb.auth.signOut(); location.href = 'index.html'; return null; }
  SESSION_ROLE = r; SESSION_USER = session.user.email.split('@')[0];
  if (r !== 'ceo' && !allowed.includes(r)){ location.href = ROLE_HOME[r]; return null; }
  return r;
}
async function signOut(){ if (DEMO){ try { sessionStorage.removeItem('dp_demo'); sessionStorage.removeItem('dp_demo_role'); } catch(e){} location.href = 'index.html'; return; } await client().auth.signOut(); location.href = 'index.html'; }
async function setPassword(username, newPassword){
  if (DEMO) return {ok:true};
  const { data:{ session } } = await sb.auth.getSession();
  const res = await fetch(CFG.SUPABASE_URL + '/functions/v1/' + CFG.PASSWORD_FUNCTION, { method:'POST',
    headers:{ 'Authorization':'Bearer ' + session.access_token, 'apikey':CFG.SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ email: username + '@' + CFG.AUTH_DOMAIN, newPassword }) });
  let out = {}; try { out = await res.json(); } catch(e){}
  if (!res.ok || out.error) throw new Error(out.error || ('HTTP ' + res.status)); return out;
}

function closeModal(){ $('#dp-ov').classList.remove('on'); }
function field(f, v){
  const id = 'f-' + f.k, req = f.req ? ' <span class="req">*</span>' : '';

  let inp;
  if (f.type === 'select') inp = `<select id="${id}">${f.blank ? '<option value=""></option>' : ''}${f.options.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(val) ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
  else if (f.type === 'textarea') inp = `<textarea id="${id}">${esc(val)}</textarea>`;
  else if (f.type === 'checks') inp = `<div class="checks" id="${id}">${f.options.map(o => `<label><input type="checkbox" value="${esc(o.v)}" ${(val||[]).includes(o.v) ? 'checked' : ''}>${esc(o.l)}</label>`).join('')}</div>`;
  else inp = `<input id="${id}" type="${f.type || 'text'}" value="${esc(val)}" ${f.type === 'number' ? 'step="0.01" min="0" inputmode="decimal"' : ''} ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}>`;

function readFields(fields){ const out = {};

    else out[f.k] = el.value === '' ? null : el.value; });

}

function recommend(o, after){

}

  const acts = [];

  if (canBD() && (isBD || o.stage === 'on_hold')) acts.push(['recommend', t('a_recommend'), 'pri']);
  if (canTech() && o.stage === 'recommended') acts.push(['review', t('a_review'), 'pri']);

      <dt>${esc(t('o_service'))}</dt><dd>${esc(o.service ? t('sv_'+o.service) : '—')}</dd>
      <dt>${esc(t('o_value'))}</dt><dd class="num">${money(o.est_value)}</dd>
      ${o.next_followup ? `<dt>${esc(t('o_next'))}</dt><dd>${esc(fmtDate(o.next_followup))} · ${esc(relDays(o.next_followup))}</dd>` : ''}
      ${o.description ? `<dt>${esc(t('o_desc'))}</dt><dd>${esc(o.description)}</dd>` : ''}

      ${(o.disciplines||[]).length ? `<dt>${esc(t('o_disc'))}</dt><dd>${o.disciplines.map(d => `<span class="pill acc">${esc(t('sv_'+d))}</span>`).join(' ')}</dd>` : ''}
      ${lead ? `<dt>${esc(t('o_lead'))}</dt><dd>${esc(lead.name)}</dd>` : ''}
      ${o.proposal_due ? `<dt>${esc(t('o_pdue'))}</dt><dd>${esc(fmtDate(o.proposal_due))} · ${esc(relDays(o.proposal_due))}</dd>` : ''}
      ${o.tech_notes ? `<dt>${esc(t('o_tech'))}</dt><dd>${esc(o.tech_notes)}</dd>` : ''}
      ${o.proposal_value ? `<dt>${esc(t('o_pval'))}</dt><dd class="num">${money(o.proposal_value)}${o.ref_no ? ' · '+esc(o.ref_no) : ''}</dd>` : ''}
    </dl>
    <div><h3 style="margin:6px 0 10px;font-size:14px">${esc(t('timeline'))}</h3>
      ${fus.length ? `<div class="timeline">${fus.map(f => `<div class="ti"><b>${esc(f.note)}</b><div class="m">${esc(fmtDate(f.f_date))} · ${esc(f.channel||'')}${f.author ? ' · '+esc(t('r_'+f.author)) : ''}${f.next_step ? ' · → '+esc(f.next_step) : ''}</div></div>`).join('')}</div>` : `<p class="sub">${esc(t('no_follow'))}</p>`}
    </div>
  </div>

    else if (a === 'recommend') recommend(o, done); else if (a === 'review'){ D.closeModal(); setStage(o, 'technical_review', done); }

function clientModal(c, after){

    <div><h3 style="margin:6px 0 10px;font-size:14px">${esc(t('timeline'))}</h3>
      ${fus.length ? `<div class="timeline">${fus.map(f => `<div class="ti"><b>${esc(f.note)}</b><div class="m">${esc(fmtDate(f.f_date))} · ${esc(f.channel||'')}${f.next_step ? ' · → '+esc(f.next_step) : ''}</div></div>`).join('')}</div>` : `<p class="sub">${esc(t('no_follow'))}</p>`}</div>

  $('#mx').onclick = D.closeModal;

}
function kanban(el, stages, opps, after){
  el.innerHTML = `<div class="board">${stages.map(s => { const list = opps.filter(o => o.stage === s); const sum = list.reduce((a,o) => a + Number(o.proposal_value || o.est_value || 0), 0);

      ${list.map(o => { const c = client(o.client_id), lead = member(o.scope_lead); const wait = o.stage === 'recommended' && o.recommended_at ? Math.floor((Date.now() - new Date(o.recommended_at)) / 864e5) : null;
        return `<div class="kc" data-o="${o.id}"><b>${esc(o.title)}</b><span class="m">${esc(c.name||'')}</span>
          <div class="row">${c.sector ? D.sectorPill(c.sector) : ''}${o.service ? `<span class="pill">${esc(t('sv_'+o.service))}</span>` : ''}</div>
          <div class="row m">${o.est_value ? `<span class="num">${money(o.proposal_value || o.est_value,{short:true})}</span>` : ''}
          ${o.next_followup && D.BD_STAGES.includes(o.stage) ? `<span class="pill ${daysUntil(o.next_followup) < 0 ? 'bad' : daysUntil(o.next_followup) === 0 ? 'warn' : ''}">${esc(relDays(o.next_followup))}</span>` : ''}
          ${wait != null ? `<span class="pill ${wait >= 3 ? 'bad' : 'warn'}">${wait} ${esc(t('days'))} ${esc(t('waiting'))}</span>` : ''}
          ${lead ? `<span>${esc(lead.name)}</span>` : ''}${o.proposal_due && o.stage === 'assigned' ? `<span class="pill ${daysUntil(o.proposal_due) < 0 ? 'bad' : 'acc'}">${esc(t('o_pdue'))}: ${esc(relDays(o.proposal_due))}</span>` : ''}</div></div>`; }).join('')}
    </div>`; }).join('')}</div>`;
  $$('[data-o]', el).forEach(k => k.onclick = () => oppModal(S.opps.find(o => o.id === +k.dataset.o), after));
}
window.PL = { S, load, client, member, clientForm, oppForm, followForm, oppModal, clientModal, kanban, recommend, assign };
})();

  <div id="board"></div></div></section>
<section class="view" id="v-follow"><div class="card">
  <div class="tools"><span class="sp"></span><button class="btn pri" id="fu2">${D.icon('plus')}<span data-t="a_follow"></span></button></div>
  <div class="tbl" id="ftbl"></div></div></section>`;
D.applyLang();
let secF = 'all', pF = 'all';
const refresh = async () => { await PL.load(); render(); };
const S = PL.S;
function openOpps(c){ return S.opps.filter(o => o.client_id === c.id && !['won','lost'].includes(o.stage)); }
function lastContact(c){ const f = S.fus.filter(x => x.client_id === c.id).sort((a,b) => a.f_date < b.f_date ? 1 : -1)[0]; return f ? f.f_date : null; }
function render(){
  const open = S.opps.filter(o => !['won','lost'].includes(o.stage));
  const due = S.opps.filter(o => D.BD_STAGES.includes(o.stage) && o.next_followup && daysUntil(o.next_followup) <= 7).sort((a,b) => a.next_followup > b.next_followup ? 1 : -1);
  const dueNow = due.filter(o => daysUntil(o.next_followup) <= 0);
  const handed = S.opps.filter(o => D.TECH_STAGES.includes(o.stage));
  const reg = S.clients.filter(c => c.vendor_status === 'registered').length, regNeed = S.clients.filter(c => c.vendor_status !== 'not_required').length;
  D.setCount('follow', dueNow.length);
  $('#kpis').innerHTML = [
    ['k_clients', S.clients.length, L(S.clients.filter(c=>c.relation==='new').length+' new this list', S.clients.filter(c=>c.relation==='new').length+' عملاء جدد'), 'acc'],
    ['k_open', money(open.reduce((s,o)=>s+Number(o.proposal_value||o.est_value||0),0),{short:true}), L(open.length+' opportunities', open.length+' فرصة'), 'hot'],
    ['k_due', dueNow.length, L(due.length+' due within 7 days', due.length+' خلال 7 أيام'), dueNow.length?'alert':''],
    ['k_reg', reg+' / '+regNeed, L('registered as vendor','مسجّل كمورّد'), '']
  ].map(([l,v,s,c]) => `<div class="kpi ${c}"><span class="l">${esc(t(l))}</span><span class="v num">${v}</span><span class="s">${esc(s)}</span></div>`).join(''); D.animate($('#kpis'));
  $('#sectors').innerHTML = D.SECTORS.map(sec => { const cs = S.clients.filter(c => c.sector === sec); const r = cs.filter(c=>c.vendor_status==='registered').length, p = cs.filter(c=>c.vendor_status==='in_progress').length, n = cs.filter(c=>c.vendor_status==='not_registered').length;
    const ops = S.opps.filter(o => cs.some(c => c.id === o.client_id) && !['won','lost'].includes(o.stage));
    return `<div class="card"><div class="hd"><div><h3>${esc(t('s_'+sec))}</h3><p class="sub" style="margin:0">${cs.length} ${esc(t('k_clients'))} · ${ops.length} ${esc(t('opps'))} · ${money(ops.reduce((s,o)=>s+Number(o.proposal_value||o.est_value||0),0),{short:true})}</p></div></div>
      <div class="bars"><div class="br"><span>${esc(t('registered'))}</span><div class="track"><div class="fill" style="width:${cs.length?r/cs.length*100:0}%;background:var(--good)"></div></div><span class="v">${r}</span></div>
      <div class="br"><span>${esc(t('in_prog'))}</span><div class="track"><div class="fill" style="width:${cs.length?p/cs.length*100:0}%;background:var(--warn)"></div></div><span class="v">${p}</span></div>
      <div class="br"><span>${esc(t('missing'))}</span><div class="track"><div class="fill" style="width:${cs.length?n/cs.length*100:0}%;background:var(--bad)"></div></div><span class="v">${n}</span></div></div></div>`; }).join('');
  $('#duelist').innerHTML = due.length ? due.map(o => { const c = PL.client(o.client_id), d = daysUntil(o.next_followup);
    return `<div class="al ${d<0?'bad':d===0?'warn':'info'}" data-o="${o.id}" style="cursor:pointer"><span class="tag">${esc(relDays(o.next_followup))}</span><div><b>${esc(c.name||'')}</b><div class="m">${esc(o.title)}</div></div>${D.stagePill(o.stage)}</div>`; }).join('') : `<div class="empty">${esc(t('nothing_due'))}</div>`;
  $$('#duelist [data-o]').forEach(el => el.onclick = () => PL.oppModal(S.opps.find(o => o.id === +el.dataset.o), refresh));
  const rel = D.RELATIONS.map(r => [r, S.clients.filter(c => c.relation === r).length]); const rm = Math.max(1, ...rel.map(x=>x[1]));
  $('#relbars').innerHTML = rel.map(([r,n]) => `<div class="br"><span>${esc(t('rel_'+r))}</span><div class="track"><div class="fill" style="width:${n/rm*100}%"></div></div><span class="v">${n}</span></div>`).join('');
  renderClients(); renderBoard(); renderFollow();
}
function renderClients(){
  const q = ($('#cq').value||'').toLowerCase();
  D.chips($('#secchips'), [{v:'all',l:t('all'),c:S.clients.length}, ...D.SECTORS.map(s => ({v:s,l:t('s_'+s),c:S.clients.filter(c=>c.sector===s).length}))], secF, v => { secF = v; renderClients(); });
  const rows = S.clients.filter(c => (secF==='all' || c.sector===secF) && (!q || (c.name+' '+(c.contact_name||'')+' '+(c.city||'')).toLowerCase().includes(q)));
  D.table($('#ctbl'), { rows, onRow: c => PL.clientModal(c, refresh), cols:[
    {h:t('c_name'), f:c => `<span class="t">${esc(c.name)}</span><div class="m">${esc([c.contact_name,c.city].filter(Boolean).join(' · '))}</div>`},
    {h:t('c_sector'), f:c => D.sectorPill(c.sector)}, {h:t('c_rel'), f:c => esc(t('rel_'+c.relation))}, {h:t('c_vendor'), f:c => D.vendorPill(c.vendor_status)},
    {h:t('c_open'), r:1, f:c => openOpps(c).length}, {h:t('c_last'), f:c => { const l = lastContact(c); return l ? esc(relDays(l)) : '<span class="m">—</span>'; }} ]});
}
function renderBoard(){
  D.chips($('#pchips'), [{v:'all',l:t('all')}, ...D.SECTORS.map(s => ({v:s,l:t('s_'+s)}))], pF, v => { pF = v; renderBoard(); });
  const ops = S.opps.filter(o => pF==='all' || PL.client(o.client_id).sector === pF);
  PL.kanban($('#board'), ['lead','following_up','recommended','technical_review','assigned','proposal_submitted','won','on_hold','lost'], ops, refresh);
}
function renderFollow(){
  const rows = S.opps.filter(o => D.BD_STAGES.includes(o.stage) || o.stage === 'on_hold').sort((a,b) => (a.next_followup||'9') > (b.next_followup||'9') ? 1 : -1);
  D.table($('#ftbl'), { rows, onRow: o => PL.oppModal(o, refresh), empty:[t('nothing_due')], cols:[
    {h:t('o_next'), f:o => o.next_followup ? `<span class="pill ${daysUntil(o.next_followup)<0?'bad':daysUntil(o.next_followup)===0?'warn':''}">${esc(relDays(o.next_followup))}</span><div class="m">${esc(fmtDate(o.next_followup))}</div>` : '<span class="m">—</span>'},
    {h:t('c_name'), f:o => `<span class="t">${esc(PL.client(o.client_id).name||'')}</span><div class="m">${esc(o.title)}</div>`},
    {h:t('c_sector'), f:o => PL.client(o.client_id).sector ? D.sectorPill(PL.client(o.client_id).sector) : ''}, {h:t('o_stage'), f:o => D.stagePill(o.stage)},
    {h:t('o_value'), r:1, f:o => money(o.est_value)} ]});
}
$('#addc').onclick = () => PL.clientForm(null, refresh); $('#cq').oninput = renderClients;
$('#addo').onclick = () => PL.oppForm(null, refresh);
$('#fu1').onclick = $('#fu2').onclick = () => PL.followForm({}, refresh);
D.onLang = render;
D.views(NAV);
await refresh();
D.DB.subscribe(['dp_clients','dp_opportunities','dp_followups'], refresh);
})();
</script>
</body>
</html>
