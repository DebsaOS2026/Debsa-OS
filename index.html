<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Debsa Platform · Sign in</title>
<meta name="author" content="Sulaiman Alkhateeb">
<link rel="icon" href="assets/logo-d.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;700&family=Manrope:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="login">
  <section class="art">
    <div class="logo" role="img" aria-label="Debsa Built Environment"></div>
    <h2 data-t="login_art"></h2>
  </section>
  <section class="form-side">
    <form id="lf" autocomplete="on">
      <div style="display:flex;align-items:center;gap:10px"><h1 data-t="login_title" style="flex:1"></h1><button type="button" class="lang" id="lang"></button></div>
      <p data-t="login_sub"></p>
      <div class="roles" id="roles">
        <button type="button" data-u="ceo"><span data-t="r_ceo"></span><small>ceo</small></button>
        <button type="button" data-u="accountant"><span data-t="r_accountant"></span><small>accountant</small></button>
        <button type="button" data-u="bizdev"><span data-t="r_bizdev"></span><small>bizdev</small></button>
        <button type="button" data-u="technical"><span data-t="r_technical"></span><small>technical</small></button>
      </div>
      <div class="f"><label for="u" data-t="username"></label><input id="u" name="username" autocomplete="username" required></div>
      <div class="f"><label for="p" data-t="password"></label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn pri" id="go" type="submit" style="justify-content:center;padding:12px" data-t="signin"></button>
      <a href="index.html?demo=ceo" id="demo" style="text-align:center;color:var(--grey);font-size:12.5px" data-t="demo_link"></a>
      <div class="cred" data-t="credit"></div>
    </form>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script>
(function(){
  const { $, $$, t, applyLang, setLang, signIn, ROLE_HOME, DEMO } = DP;
  const langBtn = $('#lang');
  const paintLang = () => { langBtn.textContent = DP.LANG() === 'ar' ? 'EN' : 'ع'; };
  langBtn.onclick = () => { setLang(DP.LANG() === 'ar' ? 'en' : 'ar'); paintLang(); };
  applyLang(); paintLang();
  $$('#roles button').forEach(b => b.onclick = () => { $('#u').value = b.dataset.u; $$('#roles button').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#p').focus(); });
  $('#u').addEventListener('input', () => $$('#roles button').forEach(x => x.setAttribute('aria-pressed', x.dataset.u === $('#u').value.trim().toLowerCase())));
  if (DEMO){ $('#p').required = false; $('#p').placeholder = 'demo'; $('#demo').classList.add('hidden'); }
  $('#lf').onsubmit = async e => {
    e.preventDefault(); $('#err').textContent = ''; $('#go').disabled = true;
    try {
      const role = await signIn($('#u').value, $('#p').value);
      location.href = ROLE_HOME[role] + (DEMO ? '?demo=' + role : '');
    } catch(err){
      $('#err').textContent = /invalid|credentials/i.test(err.message) ? t('bad_login') : err.message;
      $('#go').disabled = false;
    }
  };
})();
</script>
</body>
</html>
